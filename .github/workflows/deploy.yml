name: Deploy to GitHub Pages

# Build the Roq static site and publish target/roq/ to GitHub Pages.
# Builds from the committed content/ + data/ + public/ — no database at build time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21: Quarkus 3.40 / Roq 2.2 do not support Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate static site
        # Batch mode MUST be an env var (not -D) so it reaches the forked runner;
        # otherwise the runner starts a server and hangs instead of generating-and-exiting.
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: 'true'
        run: mvn -B -q -DskipTests package quarkus:run

      - name: Add .nojekyll
        run: touch target/roq/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/roq

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
